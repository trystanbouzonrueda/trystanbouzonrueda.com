<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perdu dans les calanques — Trystan Bouzon Rueda</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --sky1: #8fd0ff; --sky2: #e8f6ff; --sea: #2f8fd6; --sea2: #1f6fb3; --rock: #efe6d4; --rock2: #d9ccb2; --text: #12263a; --card: rgba(255,255,255,.72); --accent: #0071e3; }
    @media (prefers-color-scheme: dark) {
      :root { --sky1: #0b1630; --sky2: #23345e; --sea: #123e6e; --sea2: #0b2a4d; --rock: #6d6658; --rock2: #4f493f; --text: #eef3fb; --card: rgba(20,28,44,.72); --accent: #6cb6ff; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; padding: 16px; color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(var(--sky1), var(--sky2)); overflow: hidden; }
    .scene { position: fixed; left: 0; bottom: 0; width: 100%; height: 38vh; pointer-events: none; }
    .card { position: relative; z-index: 1; max-width: 460px; text-align: center; background: var(--card);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.5); border-radius: 22px; padding: 28px 24px; }
    .code { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 0 0 6px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 18px; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 10px 16px; border-radius: 12px; text-decoration: none; font-weight: 600; color: var(--accent); border: 1px solid currentColor; }
    a.main { background: var(--accent); color: #fff; border-color: var(--accent); }
    .boat { animation: drift 9s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes drift { from { transform: translate(-30px, 0) rotate(-2deg); } to { transform: translate(30px, 3px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .boat { animation: none; } }
  </style>
</head>
<body>
  <svg class="scene" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 70 L40 40 L70 55 L95 25 L130 60 L160 48 L190 70 Z" fill="var(--rock)" />
    <path d="M40 40 L70 55 L60 70 L30 70 Z M95 25 L130 60 L110 70 L80 70 Z" fill="var(--rock2)" />
    <path d="M250 70 L290 35 L320 52 L350 30 L400 62 L400 70 Z" fill="var(--rock)" />
    <path d="M290 35 L320 52 L305 70 L275 70 Z" fill="var(--rock2)" />
    <rect y="68" width="400" height="52" fill="var(--sea)" />
    <rect y="88" width="400" height="32" fill="var(--sea2)" />
    <g class="boat">
      <rect x="196" y="62" width="26" height="6" fill="#fff" />
      <rect x="208" y="40" width="1.6" height="22" fill="#8a5a3b" />
      <path d="M210 41 L224 60 L210 60 Z" fill="#faf6ea" />
    </g>
  </svg>
  <main class="card">
    <p class="code">404</p>
    <h1>Perdu dans les calanques</h1>
    <p>Cette page n'existe pas (ou plus). Le Vieux-Port, lui, n'a pas bougé.</p>
    <p lang="en" style="opacity:.75">Lost in the calanques: this page doesn't exist. The Vieux-Port hasn't moved, though.</p>
    <div class="links">
      <a class="main" href="/">Retour à l'île · Back to the island</a>
      <a href="/recruteur/">Version simple (CV)</a>
    </div>
  </main>
</body>
</html>
